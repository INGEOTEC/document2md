name: Publish to PyPI

on:
  push:
    tags:
      # Two publishable packages share this repository, so a bare `v*` would
      # not say which one is being released.
      - "document2md-v*"
      # Kept for the tombstone's one last release (LegalIA's issue #228):
      # dof2md was renamed to document2md and needs a final publish saying so.
      - "dof2md-v*"
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        type: choice
        options:
          - document2md
          - dof2md

concurrency:
  group: publish-${{ github.event_name == 'workflow_dispatch' && inputs.package || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `dir` mirrors scripts/check_package_versions.py's PACKAGE_DIRS: the
      # repository root is document2md itself, the tombstone lives under
      # dof2md/.
      - name: Determine package, directory and expected version
        id: pkg
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            name="${{ inputs.package }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
            name="${tag%-v*}"
            echo "tag_version=${tag##*-v}" >> "$GITHUB_OUTPUT"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          case "$name" in
            document2md) echo "dir=." >> "$GITHUB_OUTPUT" ;;
            dof2md) echo "dir=dof2md" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unknown package $name" >&2; exit 1 ;;
          esac

      - name: Install version-check dependencies
        if: github.event_name != 'workflow_dispatch'
        run: pip install packaging

      # Tags are the release trigger, so a stale tag (forgot to bump
      # __version__) must fail loudly instead of re-publishing the
      # previous version under a new tag name. `version` is declared
      # `dynamic` in both pyproject.toml files, so it has to be read the same
      # way check_package_versions.py reads it, not straight out of
      # `[project]`.
      - name: Verify tag matches pyproject.toml version
        if: github.event_name != 'workflow_dispatch'
        run: |
          pkg_version=$(python -c "import sys; sys.path.insert(0, 'scripts'); from check_package_versions import local_version; from pathlib import Path; print(local_version(Path('${{ steps.pkg.outputs.dir }}')))")
          if [ "${{ steps.pkg.outputs.tag_version }}" != "$pkg_version" ]; then
            echo "Tag version ${{ steps.pkg.outputs.tag_version }} does not match pyproject.toml version $pkg_version" >&2
            exit 1
          fi

      - name: Install build tooling
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build "${{ steps.pkg.outputs.dir }}"

      - name: Check package metadata
        run: twine check "${{ steps.pkg.outputs.dir }}"/dist/*

      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TWINE }}
        run: twine upload "${{ steps.pkg.outputs.dir }}"/dist/*
