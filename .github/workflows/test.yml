name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [document2md, dof2md]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system dependencies (mineru's opencv needs libGL)
        if: matrix.package == 'document2md'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1 libglib2.0-0
      # document2md is the repository root; dof2md is the old name's
      # tombstone, a one-release appendix in its own subdirectory. Installing
      # document2md here pulls the full mineru[pipeline] in on purpose: the
      # tests never import mineru (they mock the subprocess boundary), but
      # this is the one place that proves the declared dependency actually
      # installs on every supported Python.
      - name: Install package and test dependencies
        run: |
          if [ "${{ matrix.package }}" = "document2md" ]; then
            pip install -e ".[test]"
          else
            pip install -e "dof2md[test]"
          fi
      - name: Run tests
        run: |
          if [ "${{ matrix.package }}" = "document2md" ]; then
            pytest tests
          else
            pytest dof2md/tests
          fi

  # Runs the documentation's worked examples for real, separate from the
  # pytest matrix above. Read the Docs' own build stays HTML-only. The OCR
  # examples are marked `# doctest: +SKIP` (entering a BatchConverter starts a
  # real mineru-api server) and are verified instead by tests/test_batch.py
  # and tests/test_cli.py — the exception is written down on the page itself.
  docs-doctest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies (dot renders the pipeline diagram)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq graphviz
      - name: Install docs and package dependencies
        run: |
          pip install -r docs/requirements.txt
          # --no-deps: keeps the heavy mineru[pipeline] install out of this
          # job, which is also why .readthedocs.yaml installs it this way.
          pip install --no-deps -e .
      - name: Run the documentation's doctest examples
        run: python -m sphinx -b doctest docs/source docs/build/doctest

  # Hard gate on the single-step-ahead rule (LegalIA's issue #194, inherited
  # with the package): a package's __version__ may not jump more than one
  # release past what is published on PyPI.
  check-package-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install checker dependencies
        run: pip install packaging
      - name: Check package versions against PyPI
        run: python scripts/check_package_versions.py
