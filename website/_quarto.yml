project:
  type: website
  output-dir: _site

lang: en

execute:
  enabled: false

website:
  title: "document2md"
  site-url: https://ingeotec.github.io/document2md/
  repo-url: https://github.com/INGEOTEC/document2md
  navbar:
    background: "#f9f8f4"
    left:
      - href: index.qmd
        text: Home
      - href: pages/install.qmd
        text: Install
      - href: pages/cli.qmd
        text: Command line
      - href: pages/python.qmd
        text: Python
      - href: pages/backends.qmd
        text: Backends
      - href: https://document2md.readthedocs.io/
        text: Developer docs
    right:
      - icon: github
        href: https://github.com/INGEOTEC/document2md
        aria-label: GitHub
  page-footer:
    center: >
      document2md · [INGEOTEC](https://github.com/INGEOTEC) ·
      Code under the Apache 2.0 license

format:
  html:
    theme: [litera, style.scss]
    toc: true
    number-sections: false
    link-external-newwindow: true
